<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9c8fa">
  <meta name="description" content="Fuera del libreto. Cartas con preguntas para conversar y reír juntos.">
  <title>Fuera del libreto</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261007-cartas">
  <link rel="stylesheet" href="styles.css?v=20261007-cartas">
  <script src="data/questions.js?v=20261007-cartas" defer></script>
  <script src="app.js?v=20261007-cartas" defer></script>
</head>
<body>
  <header><h1>fuera del <em>libreto.</em></h1><button id="how-button" aria-haspopup="dialog" aria-label="Cómo jugar">?</button></header>
  <main>
    <div class="deck" id="deck">
      <div class="stack stack-one" aria-hidden="true"></div><div class="stack stack-two" aria-hidden="true"></div>
      <article class="card" id="card" aria-label="Carta de pregunta">
        <span class="corner corner-top" aria-hidden="true">✳&#xfe0e;</span>
        <p class="card-label">FUERA DEL LIBRETO</p>
        <div class="question-wrap"><h2 id="question"></h2></div>
        <span class="corner corner-bottom" aria-hidden="true">✳&#xfe0e;</span>
      </article>
    </div>
    <button class="next-button" id="next-button">Siguiente pregunta <span aria-hidden="true">→</span></button>
    <p class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></p>
  </main>
  <dialog id="how-dialog" aria-labelledby="how-title">
    <button class="close-button" id="close-dialog" aria-label="Cerrar">×</button>
    <h2 id="how-title">¿Cómo jugamos?</h2>
    <p>Léele la pregunta a la otra persona. Después cambian de turno.</p>
    <p>Para seguir, toca «Siguiente pregunta».</p>
    <button class="next-button" id="lets-play">Juguemos <span aria-hidden="true">→</span></button>
  </dialog>
  <noscript><p>Activa JavaScript para ver las preguntas.</p></noscript>
</body>
</html>
