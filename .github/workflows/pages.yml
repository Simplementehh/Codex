name: Publicar Fuera del libreto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar preguntas y recursos
        run: node scripts/check.mjs
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar la página pública
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css app.js favicon.svg .nojekyll _site/
          cp data/questions.js _site/data/
          cp assets/sofi.png _site/assets/
      - name: Subir la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
